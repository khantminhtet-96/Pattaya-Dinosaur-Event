<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket Sales Ledger</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans Myanmar',sans-serif;background:radial-gradient(circle at 20% 0%,#7c3aed 0,#25105c 28%,#07111f 70%);color:#fff;min-height:100vh;overflow-x:hidden}.orb{position:fixed;border-radius:50%;filter:blur(20px);opacity:.45;animation:float 7s ease-in-out infinite;z-index:-1}.o1{width:180px;height:180px;background:#00e5ff;top:8%;left:-50px}.o2{width:220px;height:220px;background:#ff2bd6;right:-70px;bottom:8%;animation-delay:2s}@keyframes float{50%{transform:translateY(-25px) scale(1.08)}}.wrap{max-width:1050px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}.brand h1{margin:0;font-size:clamp(26px,5vw,42px);letter-spacing:-1px}.brand p{margin:6px 0;color:#cbd5e1}.glass{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);box-shadow:0 20px 50px rgba(0,0,0,.28);backdrop-filter:blur(18px);border-radius:24px}.panel{padding:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:13px;color:#dbeafe;margin:0 0 7px}.field input,.field input[type=file]{width:100%;padding:14px 15px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.18);color:#fff;outline:none;font-size:15px}.field input:focus{border-color:#67e8f9;box-shadow:0 0 0 3px rgba(103,232,249,.12)}.ticket-preview{width:72px;height:52px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,255,255,.2);box-shadow:0 8px 20px rgba(0,0,0,.2)}.ticket-thumb{display:flex;align-items:center;gap:10px}.actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}button{border:0;border-radius:14px;padding:13px 18px;font-weight:800;cursor:pointer;color:#08111e;background:linear-gradient(135deg,#67e8f9,#a7f3d0);box-shadow:0 10px 24px rgba(34,211,238,.18)}button.secondary{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.15)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat{padding:17px}.stat small{color:#cbd5e1}.stat strong{display:block;font-size:28px;margin-top:5px}.table{overflow:auto}.row{display:grid;grid-template-columns:1.3fr .9fr 1fr 1fr 70px;gap:10px;align-items:center;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.10);min-width:700px}.head{color:#a5b4fc;font-size:12px;font-weight:800;text-transform:uppercase}.empty{text-align:center;padding:35px;color:#cbd5e1}.del{background:rgba(248,113,113,.15);color:#fecaca;padding:9px 11px;border:1px solid rgba(248,113,113,.25)}@media(max-width:650px){.wrap{padding:14px}.hero{align-items:flex-start}.grid,.stats{grid-template-columns:1fr}.panel{padding:16px}.brand p{font-size:13px}}
</style></head><body><div class="orb o1"></div><div class="orb o2"></div><main class="wrap"><header class="hero"><div class="brand"><h1>🎟️ Ticket Sales</h1><p>အရောင်းလက်မှတ် စာရင်းစနစ်</p></div><button class="secondary" onclick="clearAll()">Reset</button></header><section class="glass panel"><div class="grid"><div class="field"><label>ပွဲလုပ်တဲ့နေရာအမည်</label><input id="place" placeholder="ဥပမာ - Pattaya Event Hall"></div><div class="field"><label>ရက်စွဲ</label><input id="date" type="date"></div><div class="field"><label>လက်မှတ်အမည်</label><input id="ticket" placeholder="ဥပမာ - Entry Ticket"></div><div class="field"><label>လက်မှတ်ပုံ</label><input id="ticketImage" type="file" accept="image/*"></div><div class="field"><label>အရေအတွက်</label><input id="qty" type="number" min="1" placeholder="0"></div></div><div class="actions"><button onclick="addRow()">＋ စာရင်းထည့်မည်</button><button class="secondary" onclick="exportCSV()">⬇ CSV ထုတ်မည်</button></div></section><section class="stats"><div class="glass stat"><small>ပွဲနေရာ</small><strong id="sPlace">—</strong></div><div class="glass stat"><small>စုစုပေါင်း လက်မှတ်</small><strong id="sQty">0</strong></div><div class="glass stat"><small>စာရင်းအမျိုးအစား</small><strong id="sRows">0</strong></div></section><section class="glass panel"><div class="table"><div class="row head"><div>လက်မှတ်</div><div>အရေအတွက်</div><div>ရက်စွဲ</div><div>နေရာ</div><div></div></div><div id="list"></div></div></section></main><script>
let rows=JSON.parse(localStorage.getItem('ticketSales')||'[]');const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);function save(){localStorage.setItem('ticketSales',JSON.stringify(rows));render()}function addRow(){let place=$('place').value.trim(),date=$('date').value,ticket=$('ticket').value.trim(),qty=Number($('qty').value),file=$('ticketImage').files[0];if(!place||!date||!ticket||!qty)return alert('နေရာ၊ ရက်စွဲ၊ လက်မှတ်အမည်၊ အရေအတွက် အားလုံးဖြည့်ပါ။');let done=(image)=>{rows.unshift({place,date,ticket,qty,image:image||''});$('ticket').value='';$('qty').value='';$('ticketImage').value='';save()};if(file){let reader=new FileReader();reader.onload=()=>done(reader.result);reader.readAsDataURL(file)}else done('')}function del(i){rows.splice(i,1);save()}function render(){$('list').innerHTML=rows.length?rows.map((r,i)=>`<div class="row"><div class="ticket-thumb">${r.image?`<img class="ticket-preview" src="${r.image}" alt="ticket">`:''}<b>${esc(r.ticket)}</b></div><div><b>${r.qty.toLocaleString()}</b></div><div>${r.date}</div><div>${esc(r.place)}</div><div><button class="del" onclick="del(${i})">ဖျက်</button></div></div>`).join(''):'<div class="empty">လက်မှတ်စာရင်း မရှိသေးပါ</div>';let total=rows.reduce((a,r)=>a+r.qty,0);$('sQty').textContent=total.toLocaleString();$('sRows').textContent=rows.length;$('sPlace').textContent=rows[0]?.place||'—'}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function clearAll(){if(confirm('စာရင်းအားလုံးဖျက်မလား?')){rows=[];save()}}function exportCSV(){if(!rows.length)return alert('ထုတ်ရန်စာရင်းမရှိသေးပါ။');let csv='Ticket,Quantity,Date,Place\n'+rows.map(r=>`"${r.ticket.replaceAll('"','""')}",${r.qty},${r.date},"${r.place.replaceAll('"','""')}"`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ticket-sales.csv';a.click()}render();
</script></body></html>
